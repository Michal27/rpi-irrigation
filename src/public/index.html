<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zavlažování</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Balkon — Zavlažování</h1>
        <div class="status-bar">
            <div class="status-item">
                <span class="label">Teplota</span>
                <span class="value" id="temp-value">—</span>
            </div>
            <div class="status-item">
                <span class="label">Vlhkost</span>
                <span class="value" id="humid-value">—</span>
            </div>
            <div class="status-item">
                <span class="label">Nádoba</span>
                <span class="value" id="tank-value">—</span>
            </div>
            <div class="status-item">
                <span class="label">CPU</span>
                <span class="value" id="cpu-value">—</span>
            </div>
            <div class="status-item">
                <span class="label">Poslední cyklus</span>
                <span class="value" id="last-cycle-value">—</span>
            </div>
            <div class="status-item">
                <span class="label">Další cyklus</span>
                <span class="value" id="next-cycle-value">—</span>
            </div>
            <div class="cycle-active" id="cycle-active" hidden>
                ↻ PROBÍHÁ ZAVLAŽOVÁNÍ
            </div>
            <div class="safety-alert" id="safety-alert" hidden>
                ⚠ BEZPEČNOSTNÍ VYPNUTÍ
            </div>
            <button class="safety-toggle-btn safety-toggle-stop" id="safety-toggle-btn">
                ⏹ Zastavit zavlažování
            </button>
            <button class="sensor-read-btn" id="sensor-read-btn">⟳ Měření sensorů</button>
        </div>
    </header>

    <main>
        <section>
            <h2>Balkon</h2>
            <div class="balcony-grid" id="balcony-grid"></div>
        </section>

        <section id="safety-log-section">
            <h2>Safety log</h2>
            <div id="safety-log"></div>
            <div style="display:flex; align-items:center; gap:1rem; margin-top:0.75rem; flex-wrap:wrap;">
                <button class="test-discord-btn" id="test-discord-btn">Testovat Discord notifikaci</button>
                <span id="test-discord-result"></span>
                <button class="clear-log-btn" id="clear-log-btn">🗑 Vymazat log</button>
            </div>
        </section>

        <section>
            <h2>Klima — posledních 24 h</h2>
            <div class="chart-container">
                <canvas id="climate-chart"></canvas>
            </div>
        </section>
    </main>

    <div id="force-modal" hidden>
        <div class="force-modal-backdrop"></div>
        <div class="force-modal-box">
            <h3 class="force-modal-title">Automatické zavlažování</h3>
            <p class="force-modal-sub" id="force-modal-sub"></p>
            <p class="force-modal-hint">Počet zavlažení za den bez ohledu na sensor</p>
            <div class="force-modal-options" id="force-modal-options">
                <button data-n="0">Vypnuto</button>
                <button data-n="1">1×</button>
                <button data-n="2">2×</button>
                <button data-n="3">3×</button>
                <button data-n="4">4×</button>
                <button data-n="5">5×</button>
                <button data-n="6">6×</button>
                <button data-n="7">7×</button>
                <button data-n="8">8×</button>
            </div>
            <div class="force-modal-footer">
                <button id="force-modal-save">Uložit</button>
                <button id="force-modal-cancel">Zrušit</button>
            </div>
        </div>
    </div>

    <script src="/chart.min.js"></script>
    <script src="/dashboard.js"></script>
</body>
</html>
